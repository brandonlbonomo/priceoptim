services:
  - type: web
    name: blb-realty
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build && cp -r .next/static .next/standalone/.next/static && cp -r public .next/standalone/public
    startCommand: node .next/standalone/server.js
    envVars:
      - key: NEXT_PUBLIC_BASE_URL
        sync: false
      - key: DATABASE_PATH
        value: /data/subscribers.db
      - key: PORT
        value: 3000
      - key: HOSTNAME
        value: 0.0.0.0
    disk:
      name: blb-realty-data
      mountPath: /data
      sizeGB: 1
